nd:#0b1727;border:1px solid #29415f;border-radius:18px;padding:20px;box-shadow:0 25px 90px rgba(0,0,0,.5)}.modal h3{margin:0 0 5px}.modal p{margin:0 0 16px;color:#8195ad;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.footer-note{margin-top:20px;color:#657993;font-size:10px;text-align:center}

<body>
<div id="login" class="login"><div class="login-card"><div class="brand"><div class="brandmark">🏢</div><div><h1>EPIC LEASE</h1><p>AI Leasing Command Center</p></div></div><div style="height:22px"></div><h1>Welcome back</h1><p>Sign in with the administrator account you created in Supabase.</p><form id="login-form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;margin-top:8px" type="submit">Sign in</button><div id="login-error" class="error"></div></form><div class="footer-note">Your database credentials are never entered here.</div></div></div>
<div id="app" class="shell hidden"><header class="top"><div class="brand"><div class="brandmark">🏢</div><div><h1>EPIC LEASE</h1><p>AI Leasing Command Center</p></div></div><div class="userbar"><span id="user-email" class="user-email"></span><button id="logout" class="btn">Sign out</button></div></header><div class="layout"><aside class="side"><nav class="nav"><button class="active" data-view="dashboard">🏠 Command Center</button><button data-view="leads">🔎 Leads</button><button data-view="properties">🏢 Properties</button><button data-view="tenants">👤 Tenants</button><button data-view="matches">🎯 Matches</button><button data-view="tasks">⚡ Tasks</button><button data-view="ai">🤖 AI Workforce</button></nav></aside><main id="main" class="main"></main></div></div>
<div id="toast" class="toast hidden"></div><div id="modal-root"></div>
<script src="config.js"></script><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.EPIC_LEASE_CONFIG||{};const supabase=createClient(cfg.supabaseUrl,cfg.publishableKey);if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const toast=msg=>{$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)};const fmt=n=>new Intl.NumberFormat('en-PH').format(n||0);let currentView='dashboard';
async function count(table,filter){let q=supabase.from(table).select('*',{count:'exact',head:true});if(filter)q=filter(q);const{count,error}=await q;if(error)throw error;return count||0}async function loadCounts(){const[leads,properties,tenants,matches,tasks]=await Promise.all([count('leads'),count('properties',q=>q.eq('status','active')),count('tenants',q=>q.eq('status','active')),count('matches',q=>q.eq('status','candidate')),count('tasks',q=>q.eq('status','pending'))]);return{leads,properties,tenants,matches,tasks}}
async function dashboard(){const c=await loadCounts();$('main').innerHTML=`<div class="hero"><div><div class="eyebrow">Live operations</div><h2>Command Center</h2><p>Your leasing operation at a glance.</p></div><button id="refresh" class="btn">↻ Refresh</button></div><div class="grid"><div class="card metric"><div class="label">New / active leads</div><div class="value">${fmt(c.leads)}</div><div class="sub">From the leasing pipeline</div></div><div class="card metric"><div class="label">Active properties</div><div class="value">${fmt(c.properties)}</div><div class="sub">Available inventory</div></div><div class="card metric"><div class="label">Active tenants</div><div class="value">${fmt(c.tenants)}</div><div class="sub">Demand pipeline</div></div><div class="card metric"><div class="label">Candidate matches</div><div class="value">${fmt(c.matches)}</div><div class="sub">Awaiting next action</div></div></div><div class="section"><div class="section-title"><h3>🔥 Needs Me</h3><span class="muted">Priority leads requiring human action</span></div><div id="needs-me" class="list"></div></div><div class="section"><div class="section-title"><h3>🎯 Strong matches</h3><span class="muted">Match score ≥ 80</span></div><div id="strong-matches" class="list"></div></div><div class="section"><div class="section-title"><h3>⚠️ Approval queue</h3><span class="muted">Human approval requests</span></div><div id="attention" class="attention"></div></div><div class="section"><div class="section-title"><h3>Recent tasks</h3><button id="viewtasks" class="btn">Open follow-ups</button></div><div id="recent-tasks" class="list"></div></div>`;$('refresh').onclick=dashboard;$('viewtasks').onclick=()=>navigate('tasks');await loadPriorityQueue();await loadAttention();await loadRecentTasks()}
async function loadPriorityQueue(){const needs=$('needs-me'),strong=$('strong-matches');const{data:leads,error:leadError}=await supabase.from('leads').select('*').in('status',['new','potential','qualified','contacted','responded','active']).order('score',{ascending:false}).order('created_at',{ascending:false}).limit(12);if(leadError){needs.innerHTML=`<div class="empty">${esc(leadError.message)}</div>`}else{const priority=(leads||[]).filter(l=>Number(l.score||0)>=70||l.status==='new').slice(0,6);needs.innerHTML=priority.length?priority.map(l=>`<div class="row clickable" data-lead-id="${esc(l.id)}"><div><div class="title">${esc((l.kind||'lead').toUpperCase())} · Score ${esc(l.score??0)}</div><div class="desc">${esc(l.next_action||'Review lead')} · Status: ${esc(l.status||'new')}</div></div><span class="badge">Needs Me</span></div>`).join(''):'<div class="empty">No priority leads right now.</div>';needs.querySelectorAll('[data-lead-id]').forEach(row=>row.onclick=()=>openLeadDetails(row.dataset.leadId))}const{data:matches,error:matchError}=await supabase.from('matches').select('*').gte('total_score',80).order('total_score',{ascending:false}).order('created_at',{ascending:false}).limit(6);if(matchError){strong.innerHTML=`<div class="empty">${esc(matchError.message)}</div>`}else{strong.innerHTML=matches?.length?matches.map(m=>`<div class="row"><div><div class="title">Score ${esc(m.total_score)}</div><div class="desc">Property: ${esc(m.property_id)} · Tenant: ${esc(m.tenant_id)}</div><div class="desc">${esc(m.explanation||'Strong property-tenant match')}</div></div><span class="badge">${esc(m.status||'candidate')}</span></div>`).join(''):'<div class="empty">No strong matches yet.</div>'}}
async function loadAttention(){const{data,error}=await supabase.from('tasks').select('*').eq('requires_approval',true).neq('approval_status','approved').neq('approval_status','rejected').order('priority',{ascending:false}).limit(6);const el=$('attention');if(error){el.innerHTML=`<div class="item">Unable to load approval queue.</div>`;return}if(!data?.length){el.innerHTML='<div class="item"><b>All clear.</b><div class="muted" style="margin-top:5px">No human approvals are waiting.</div></div>';return}el.innerHTML=data.map(t=>`<div class="item"><span class="badge">${esc(t.assigned_agent||'agent')}</span><div style="margin-top:8px;font-weight:650">${esc(t.task_type)}</div><div class="muted" style="margin-top:5px">Priority ${esc(t.priority)} · ${esc(t.approval_status)}</div></div>`).join('')}
async function loadRecentTasks(){const{data}=await supabase.from('tasks').select('*').order('created_at',{ascending:false}).limit(5);const el=$('recent-tasks');el.innerHTML=data?.length?data.map(t=>`<div class="row"><div><div class="title">${esc(t.task_type)}</div><div class="desc">${esc(t.assigned_agent||'unassigned')} · ${new Date(t.created_at).toLocaleString()}</div></div><span class="badge">${esc(t.status)}</span></div>`).join(''):'<div class="empty">No tasks yet. The workforce will populate this queue when ingestion starts.</div>'}
function openFollowUpModal(lead){
  const defaultRunAfter=new Date(Date.now()+24*60*60*1000);
  const localValue=new Date(defaultRunAfter.getTime()-defaultRunAfter.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $('modal-root').innerHTML=`<div class="modal-backdrop" id="followup-backdrop"><div class="modal"><h3>Create Follow-up</h3><p>Create a follow-up task for this ${esc(lead.kind||'lead')} lead.</p><form id="followup-form"><div class="field"><label>Task type</label><select id="followup-type"><option value="follow_up">Follow-up</option><option value="contact_lead">Contact lead</option><option value="verify_details">Verify details</option><option value="viewing_follow_up">Viewing follow-up</option></select></div><div class="field"><label>Priority</label><select id="followup-priority"><option value="90">High</option><option value="70" selected>Medium</option><option value="50">Normal</option></select></div><div class="field"><label>Due</label><input id="followup-due" type="datetime-local" value="${localValue}" required></div><div class="field"><label>Requires approval</label><select id="followup-approval"><option value="true" selected>Yes</option><option value="false">No</option></select></div><div class="field"><label>Notes</label><input id="followup-notes" type="text" maxlength="500" value="${esc(lead.next_action||'Review and follow up with lead')}"></div><div class="modal-actions"><button type="button" id="followup-cancel" class="btn">Cancel</button><button type="submit" class="btn primary">Create task</button></div><div id="followup-error" class="error"></div></form></div></div>`;
  $('followup-cancel').onclick=()=>openLeadDetails(lead.id);
  $('followup-backdrop').onclick=e=>{if(e.target.id==='followup-backdrop')openLeadDetails(lead.id)};
  $('followup-form').onsubmit=async e=>{
    e.preventDefault();
    const btn=e.submitter;btn.disabled=true;btn.textContent='Creating…';$('followup-error').textContent='';
    const runAfter=new Date($('followup-due').value).toISOString();
    const needsApproval=$('followup-approval').value==='true';
    const taskType=$('followup-type').value;
    const payload={task_type:taskType,priority:Number($('followup-priority').value),status:'pending',requires_approval:needsApproval,approval_status:needsApproval?'pending':'not_required',run_after:runAfter,payload:{lead_id:lead.id,lead_kind:lead.kind||null,next_action:$('followup-notes').value.trim()||'Review and follow up with lead',source:'EPIC LEASE'}};
    const{error}=await supabase.from('tasks').insert(payload);
    if(error){$('followup-error').textContent=error.message;btn.disabled=false;btn.textContent='Create task';return}
    toast('Follow-up task created');await openLeadDetails(lead.id);
  };
}

async function tasksView(){
  $('main').innerHTML=`<div class="hero"><div><div class="eyebrow">Operations</div><h2>Follow-up Tasks</h2><p>Human-approved follow-up work generated from your leasing pipeline.</p></div><button id="refresh" class="btn">↻ Refresh</button></div><div class="card"><div id="task-list" class="list"><div class="empty">Loading…</div></div></div>`;
  $('refresh').onclick=tasksView;
  const{data,error}=await supabase.from('tasks').select('*').order('run_after',{ascending:true}).order('created_at',{ascending:false}).limit(50);
  const el=$('task-list');
  if(error){el.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}
  if(!data?.length){el.innerHTML='<div class="empty">No follow-up tasks yet.</div>';return}
  const now=Date.now();
  el.innerHTML=data.map(t=>{const due=t.run_after?new Date(t.run_after):null;const overdue=due&&due.getTime()<now&&t.status!=='completed';return `<div class="row"><div><div class="title">${esc(t.task_type||'task')}</div><div class="desc">Priority: ${esc(t.priority??'—')} · ${overdue?'OVERDUE':'Due: '+(due?due.toLocaleString():'—')}</div><div class="desc">Approval: ${esc(t.approval_status||'—')}</div></div><span class="badge">${esc(t.status||'pending')}</span></div>`}).join('')
}

async function openLeadDetails(id){const{data,error}=await supabase.from('leads').select('*').eq('id',id).single();if(error){toast(error.message);return}const rows=[['ID',data.id],['Type',data.kind],['Status',data.status],['Priority',data.priority??'—'],['Score',data.score??'—'],['Next action',data.next_action||'—'],['Next action at',data.next_action_at||'—'],['Source post ID',data.source_post_id||'—'],['Owner ID',data.owner_id||'—'],['Property ID',data.property_id||'—'],['Tenant ID',data.tenant_id||'—'],['Created at',data.created_at||'—']];const ownerAction=data.kind==='owner'&&!data.owner_id?'<button type="button" id="create-owner" class="btn primary">＋ Create / Link Owner</button>':'';const propertyAction=data.kind==='owner'&&!data.property_id?'<button type="button" id="create-property" class="btn primary">＋ Create / Link Property</button>':'';const leadKind=String(data.kind??data.type??'').trim().toLowerCase();const tenantAction=leadKind==='tenant'&&!data.tenant_id?'<button type="button" id="create-tenant" class="btn primary">＋ Create / Link Tenant</button>':'';const followUpAction='<button type="button" id="create-followup" class="btn">⚡ Create Follow-up</button>';$('modal-root').innerHTML=`<div class="modal-backdrop" id="detail-backdrop"><div class="modal"><h3>Lead details</h3><div class="detail-grid">${rows.map(x=>`<div><div class="muted" style="font-size:12px">${esc(x[0])}</div><div style="margin-top:3px;word-break:break-word">${esc(String(x[1]))}</div></div>`).join('')}</div><div class="modal-actions">${ownerAction}${propertyAction}${tenantAction}${followUpAction}<button type="button" id="detail-close" class="btn">Close</button></div></div></div>`;$('detail-close').onclick=closeLeadModal;if($('create-owner'))$('create-owner').onclick=()=>openOwnerModal(data);if($('create-property'))$('create-property').onclick=()=>openPropertyModal(data);if($('create-tenant'))$('create-tenant').onclick=()=>openTenantModal(data);if($('create-followup'))$('create-followup').onclick=()=>openFollowUpModal(data);$('detail-backdrop').onclick=e=>{if(e.target.id==='detail-backdrop')closeLeadModal()}}
async function openPropertyModal(lead){$('modal-root').innerHTML=`<div class="modal-backdrop" id="property-backdrop"><div class="modal"><h3>Create Property Profile</h3><p>Create the property record and link it to this lead.</p><form id="property-form"><div class="field"><label>City</label><input id="property-city" type="text" maxlength=100 value="Mandaluyong City" required></div><div class="field"><label>Building</label><input id="property-building" type="text" maxlength=255></div><div class="field"><label>Unit identifier</label><input id="property-unit" type="text" maxlength=100></div><div class="field"><label>Property type</label><input id="property-type" type="text" maxlength=100 value="Condominium"></div><div class="field"><label>Bedrooms</label><input id="property-bedrooms" type="number" min=0 max=20 step=1></div><div class="field"><label>Monthly rent</label><input id="property-rent" type="number" min=0 step=0.01></div><div class="field"><label>Minimum lease (months)</label><input id="property-lease" type="number" min=1 max=120 step=1></div><div class="field"><label>Notes</label><textarea id="property-notes" maxlength=2000></textarea></div><div class="modal-actions"><button type="button" id="property-cancel" class="btn">Cancel</button><button type="submit" class="btn primary">Create property</button></div><div id="property-error" class="error"></div></form></div></div>`;$('property-cancel').onclick=()=>openLeadDetails(lead.id);$('property-backdrop').onclick=e=>{if(e.target.id==='property-backdrop')openLeadDetails(lead.id)};$('property-form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent='Creating…';$('property-error').textContent='';const payload={owner_id:lead.owner_id||null,source_post_id:lead.source_post_id||null,city:$('property-city').value.trim(),building:$('property-building').value.trim()||null,unit_identifier:$('property-unit').value.trim()||null,property_type:$('property-type').value.trim()||null,bedrooms:$('property-bedrooms').value===''?null:Number($('property-bedrooms').value),monthly_rent:$('property-rent').value===''?null:Number($('property-rent').value),minimum_lease_months:$('property-lease').value===''?null:Number($('property-lease').value),status:'active',confidence:0.5,notes:$('property-notes').value.trim()||null};const{data:property,error}=await supabase.from('properties').insert(payload).select().single();if(error){$('property-error').textContent=error.message;btn.disabled=false;btn.textContent='Create property';return}const{data:updatedLead,error:linkError}=await supabase.from('leads').update({property_id:property.id,status:'qualified'}).eq('id',lead.id).select('id,property_id,status').maybeSingle();if(linkError){$('property-error').textContent='Property created, but linking failed: '+linkError.message;btn.disabled=false;btn.textContent='Create property';return}if(!updatedLead||updatedLead.id!==lead.id||updatedLead.property_id!==property.id){$('property-error').textContent='Property was created, but the lead was not linked. No lead row was updated.';btn.disabled=false;btn.textContent='Create property';return}toast('Property profile created and linked');await openLeadDetails(lead.id)}}

async function listView(type,table,title,subtitle,columns,extra=''){ $('main').innerHTML=`<div class="hero"><div><div class="eyebrow">Operations</div><h2>${title}</h2><p>${subtitle}</p></div><div style="display:flex;gap:8px"><button id="refresh" class="btn">↻ Refresh</button>${extra}</div></div><div class="card"><div id="list" class="list"><div class="empty">Loading…</div></div></div>`;$('refresh').onclick=()=>listView(type,table,title,subtitle,columns,extra);let q=supabase.from(table).select('*').order('created_at',{ascending:false}).limit(50);const{data,error}=await q;const el=$('list');if(error){el.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}if(!data?.length){el.innerHTML='<div class="empty">No records yet.</div>';return}el.innerHTML=data.map(r=>`<div class="row clickable" data-id="${esc(r.id)}"><div>${columns.map((c,i)=>i===0?`<div class="title">${esc(c[1](r))}</div>`:`<div class="desc">${esc(c[0])}: ${esc(c[1](r))}</div>`).join('')}</div><span class="badge">${esc(r.status||r.classification||'record')}</span></div>`).join('');el.querySelectorAll('.row[data-id]').forEach(row=>row.onclick=()=>type==='leads'?openLeadDetails(row.dataset.id):null)}

function openLeadModal(){ $('modal-root').innerHTML=`<div class="modal-backdrop" id="lead-backdrop"><div class="modal"><h3>Add Lead</h3><p>Create a lead directly in the Supabase leasing pipeline. This does not send any message or contact anyone.</p><form id="lead-form"><div class="field"><label>Lead type</label><select id="lead-kind" required><option value="owner">Owner — property to lease</option><option value="tenant">Tenant — looking to rent</option></select></div><div class="field"><label>Initial score (0–100)</label><input id="lead-score" type="number" min="0" max="100" value="0" required></div><div class="field"><label>Next action</label><input id="lead-next-action" type="text" maxlength="500" placeholder="Example: Verify listing details"></div><div class="modal-actions"><button type="button" id="lead-cancel" class="btn">Cancel</button><button type="submit" class="btn primary">Save lead</button></div><div id="lead-error" class="error"></div></form></div></div>`;$('lead-cancel').onclick=closeLeadModal;$('lead-backdrop').onclick=e=>{if(e.target.id==='lead-backdrop')closeLeadModal()};$('lead-form').onsubmit=saveLead}

async function matchesView(){
  $('main').innerHTML=`<div class="hero"><div><div class="eyebrow">Matching</div><h2>Matches</h2><p>Property-to-tenant candidates scored from your actual records.</p></div><div style="display:flex;gap:8px"><button id="run-matches" class="btn primary">🎯 Run matching</button><button id="refresh" class="btn">↻ Refresh</button></div></div><div class="card"><div id="match-status" class="muted" style="margin-bottom:10px"></div><div id="list" class="list"><div class="empty">Loading…</div></div></div>`;
  $('refresh').onclick=matchesView;
  $('run-matches').onclick=runMatching;
  await renderMatches();
}
async function renderMatches(){
  const{data,error}=await supabase.from('matches').select('*').order('created_at',{ascending:false}).limit(50);
  const el=$('list'); if(error){el.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}
  if(!data?.length){el.innerHTML='<div class="empty">No matches yet. Tap Run matching to generate candidates.</div>';return}
  el.innerHTML=data.map(r=>`<div class="row"><div><div class="title">Score: ${esc(r.total_score??'—')}</div><div class="desc">Property: ${esc(r.property_id||'—')}</div><div class="desc">Tenant: ${esc(r.tenant_id||'—')}</div><div class="desc">Location ${esc(r.location_score??'—')} · Bedrooms ${esc(r.bedroom_score??'—')} · Budget ${esc(r.budget_score??'—')} · Furnishing ${esc(r.furnishing_score??'—')} · Move-in ${esc(r.move_in_score??'—')}</div><div class="desc">${esc(r.explanation||'—')}</div></div><span class="badge">${esc(r.status||'candidate')}</span></div>`).join('');
}
function scoreMatch(p,t){
  let location=0, bedroom=0, budget=0, furnishing=0, moveIn=0;
  const notes=[];
  const pc=(p.city||'').trim().toLowerCase(), tc=(t.desired_city||'').trim().toLowerCase();
  if(pc&&tc){ location=pc===tc?100:0; if(location)notes.push('city matches'); }
  else location=50;
  const pb=Number(p.bedrooms), tmin=Number(t.bedrooms_min), tmax=Number(t.bedrooms_max);
  if(Number.isFinite(pb)&&Number.isFinite(tmin)){ const max=Number.isFinite(tmax)&&tmax>0?tmax:tmin; bedroom=pb>=tmin&&pb<=max?100:pb>=tmin?70:0; if(bedroom===100)notes.push('bedrooms fit'); }
  else bedroom=50;
  const rent=Number(p.monthly_rent), bmin=Number(t.budget_min), bmax=Number(t.budget_max);
  if(Number.isFinite(rent)&&Number.isFinite(bmax)){ budget=rent<=bmax&&( !Number.isFinite(bmin)||rent>=bmin )?100:rent<=bmax*1.1?60:0; if(budget===100)notes.push('rent fits budget'); }
  else budget=50;
  if(t.finish_preference==null && p.furnished==null) furnishing=50;
  else if(t.finish_preference==null || p.furnished==null) furnishing=50;
  else { const wants=/furnished|fully furnished/i.test(String(t.finish_preference)); furnishing=(Boolean(p.furnished)===wants)?100:0; if(furnishing===100)notes.push('furnishing fits'); }
  moveIn=50;
  const total=Math.round(location*0.30+bedroom*0.20+budget*0.30+furnishing*0.10+moveIn*0.10);
  const explanation=notes.length?notes.join(', ')+'. Move-in score is neutral until dates are structured.': 'Partial match; missing structured preferences keep some scores neutral.';
  return{location_score:location,bedroom_score:bedroom,budget_score:budget,furnishing_score:furnishing,move_in_score:moveIn,total_score:total,explanation};
}
async function runMatching(){
  const btn=$('run-matches'); btn.disabled=true; btn.textContent='Matching…'; $('match-status').textContent='Reading current properties and tenants…';
  try{
    const[{data:properties,error:pe},{data:tenants,error:te}]=await Promise.all([
      supabase.from('properties').select('*').not('status','eq','leased').not('status','eq','expired').limit(200),
      supabase.from('tenants').select('*').not('status','eq','lost').not('status','eq','unqualified').limit(200)
    ]);
    if(pe)throw pe; if(te)throw te;
    let created=0, skipped=0;
    for(const p of (properties||[])) for(const t of (tenants||[])){
      const scores=scoreMatch(p,t);
      if(scores.total_score<50)continue;
      const{data:existing,error:checkError}=await supabase.from('matches').select('id').eq('property_id',p.id).eq('tenant_id',t.id).limit(1);
      if(checkError)throw checkError;
      if(existing?.length){skipped++;continue}
      const{error}=await supabase.from('matches').insert({property_id:p.id,tenant_id:t.id,...scores,status:'candidate'});
      if(error)throw error; created++;
    }
    $('match-status').textContent=`Matching complete: ${created} new candidate${created===1?'':'s'}, ${skipped} existing pair${skipped===1?'':'s'} skipped.`;
    await renderMatches();
  }catch(e){$('match-status').textContent='Matching failed: '+e.message}
  finally{btn.disabled=false;btn.textContent='🎯 Run matching'}
}

function navigate(view){currentView=view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const routes={dashboard,leads:leadsView,properties:()=>listView('properties','properties','Properties','Inventory in the leasing pipeline.',[['Building',r=>r.building||'—'],['Rent',r=>r.monthly_rent?`₱${fmt(r.monthly_rent)}`:'—'],['Bedrooms',r=>r.bedrooms??'—']]),tenants:()=>listView('tenants','tenants','Tenants','Rental demand pipeline.',[['City',r=>r.desired_city||'—'],['Budget',r=>r.budget_max?`₱${fmt(r.budget_max)}`:'—'],['Bedrooms',r=>`${r.bedrooms_min??'—'}–${r.bedrooms_max??'—'}`]]),matches:matchesView,tasks:tasksView,ai:aiView};return routes[view]()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('logout').onclick=async()=>{await supabase.auth.signOut();showLogin()};function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}async function showApp(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user-email').textContent=session.user.email||'';navigate(currentView)}$('login-form').onsubmit=async e=>{e.preventDefault();$('login-error').textContent='';const btn=e.submitter;btn.disabled=true;btn.textContent='Signing in…';const{data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});btn.disabled=false;btn.textContent='Sign in';if(error){$('login-error').textContent=error.message;return}await showApp(data.session)};supabase.auth.onAuthStateChange((_event,session)=>{if(session)showApp(session);else showLogin()});const{data:{session}}=await supabase.auth.getSession();if(session)await showApp(session);else showLogin();
